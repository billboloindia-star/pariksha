service: pariksha

provider:
  name: aws
  profile: billbolo
  runtime: python3.12
  region: ap-south-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 28

  environment:
    STAGE: ${self:provider.stage}
    USERS_TABLE: pariksha-users-${self:provider.stage}
    ATTEMPTS_TABLE: pariksha-attempts-${self:provider.stage}
    LIBRARY_TABLE: pariksha-library-${self:provider.stage}
    LIBRARY_BUCKET: pariksha-library-${self:provider.stage}-${aws:accountId}
    BANK_TABLE: pariksha-bank-${self:provider.stage}
    JWT_SECRET: ${env:JWT_SECRET}
    GEMINI_API_KEY: ${env:GEMINI_API_KEY}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:Query
            - dynamodb:UpdateItem
          Resource: arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:provider.environment.USERS_TABLE}
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Query
            - dynamodb:UpdateItem
          Resource: arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:provider.environment.ATTEMPTS_TABLE}
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource: arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:provider.environment.LIBRARY_TABLE}
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:Query
            - dynamodb:BatchWriteItem
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:provider.environment.BANK_TABLE}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:provider.environment.BANK_TABLE}/index/*
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${self:provider.environment.LIBRARY_BUCKET}/*
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: arn:aws:logs:${aws:region}:${aws:accountId}:*

package:
  patterns:
    - '!.venv/**'
    - '!node_modules/**'
    - '!.git/**'
    - '!.serverless/**'
    - '!README.md'
    - 'src/**'

functions:
  app:
    handler: src.main.handler
    layers:
      - Ref: PythonRequirementsLambdaLayer
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
      - httpApi:
          path: /
          method: ANY

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.USERS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH

    AttemptsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.ATTEMPTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: when
            AttributeType: N
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: when
            KeyType: RANGE

    LibraryTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.LIBRARY_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: itemId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: itemId
            KeyType: RANGE

    BankTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.BANK_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: questionId
            AttributeType: S
          - AttributeName: sectionChapter
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: questionId
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: BankBySectionChapterIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: sectionChapter
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    LibraryBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.environment.LIBRARY_BUCKET}
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [GET]
              AllowedOrigins:
                - https://pariksha.billbolo.in
                - http://localhost:5173
              AllowedHeaders: ['*']

custom:
  pythonRequirements:
    dockerizePip: true
    layer: true
    slim: true
    strip: true
    useDownloadCache: true
    useStaticCache: true
    noDeploy:
      - boto3
      - botocore
      - s3transfer
      - jmespath
